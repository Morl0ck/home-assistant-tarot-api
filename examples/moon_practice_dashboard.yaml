# Optional native dashboard example for HA 2024.11+.
# The integration creates this layout automatically on first admin opening.
# Check Developer tools -> States and adjust entity IDs for your installation.
# The integration registers its frontend module; no extra resource is needed.
title: Daily Practice
views:
- title: Affirmations
  path: affirmation
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:moon-practice-card
      section: affirmation
      affirmation:
        entity: sensor.daily_affirmation
        button: button.new_affirmation
      grid_options:
        columns: full
        rows: auto
